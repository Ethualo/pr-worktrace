name: "PR Worktrace"
description: "AI PR review with human-judgment work-trace logging"
inputs:
  mode:
    description: "review | poll"
    required: false
    default: "review"
  github_token:
    description: "GitHub token with repo scope"
    required: true
  llm_api_key:
    description: "API key for the configured LLM provider (required for mode: review)"
    required: false
  repository:
    description: "owner/repo"
    required: true
  pull_number:
    description: "Pull request number"
    required: true
  commit_id:
    description: "Head commit SHA of the PR (required for mode: review; optional for mode: poll)"
    required: false
  config_path:
    description: "Path to worktrace.config.json (mode: review only)"
    required: false
    default: "worktrace.config.json"
  branch:
    description: "PR head branch name (required for mode: poll)"
    required: false
  date:
    description: "Date string (YYYY-MM-DD) used in the worklog file name (required for mode: poll)"
    required: false
  pr_state:
    description: "open | closed — whether the worklog file should be committed (mode: poll only)"
    required: false
    default: "open"
branding:
  icon: "eye"
  color: "blue"
runs:
  using: "node20"
  main: "packages/action/dist/index.js"
